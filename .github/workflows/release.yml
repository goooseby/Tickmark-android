name: Prepare signed release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix, e.g. 0.2.0'
        required: true
        default: '0.2.0'
      version_code:
        description: 'Strictly increasing Android versionCode'
        required: true
        default: '2'
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      VERSION_CODE: ${{ inputs.version_code }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TICKMARK_KEYSTORE_PATH: /tmp/tickmark-release.jks
      TICKMARK_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      TICKMARK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      TICKMARK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Validate release and restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: python scripts/prepare-release.py
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew :engine:test :app:assembleRelease :app:lintRelease -PtickmarkVersionName="$VERSION" -PtickmarkVersionCode="$VERSION_CODE" --console=plain
      - name: Verify and prepare files
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/tickmark-v$VERSION.apk"
          cd release
          sha256sum "tickmark-v$VERSION.apk" > SHA256SUMS.txt
          python -c 'import json,os; json.dump({"versionName":os.environ["VERSION"],"versionCode":int(os.environ["VERSION_CODE"])},open("update.json","w"))'
      - name: Create draft with release notes
        run: |
          if [ -f "docs/releases/$VERSION.md" ]; then
            gh release create "v$VERSION" release/* --target "$GITHUB_SHA" --title "Tickmark $VERSION" --notes-file "docs/releases/$VERSION.md" --draft
          else
            gh release create "v$VERSION" release/* --target "$GITHUB_SHA" --title "Tickmark $VERSION" --generate-notes --draft
          fi
      - name: Remove signing key
        if: always()
        run: rm -f "$TICKMARK_KEYSTORE_PATH"
